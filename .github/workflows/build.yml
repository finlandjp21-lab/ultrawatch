name: Test and build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # 1) Backtest: all core logic tests must pass before any APK is built
      - name: Run core tests
        run: |
          chmod +x gradlew
          ./gradlew :core:test --console=plain 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      # 2) Build watch and phone APKs
      - name: Build APKs
        run: |
          ./gradlew :app:assembleDebug :mobile:assembleDebug --console=plain --continue 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # Turn the first compile errors into one annotation so they're readable without the full log
      - name: Report errors
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E "^e: |error:|What went wrong|FAILED|Could not|> " "$f" | grep -v "^> Task" | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$msg" ] && echo "::error title=$f::$msg"
          done
          true

      - name: Name APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/UltraWatch-watch.apk
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/UltraWatch-phone.apk

      # Latest APKs on the Releases page (tests passed and both apps built)
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: UltraWatch latest build
          body: |
            Tested build from ${{ github.sha }}. Core tests passed before building.
            UltraWatch-watch.apk: install on a Wear OS watch. UltraWatch-phone.apk: install on your Android phone.
            Created by Harshvardhan Technologies.
          prerelease: false
          make_latest: true
          files: dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UltraWatch-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: core/build/reports/tests/
