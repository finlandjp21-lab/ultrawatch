name: Test and build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # 1) Backtest: all core logic tests must pass before any APK is built
      - name: Run core tests
        run: ./gradlew :core:test --stacktrace

      # 2) Build watch and phone APKs
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :mobile:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: UltraWatch-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            mobile/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: core/build/reports/tests/
